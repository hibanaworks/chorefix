[package]
name = "hibana-tracefix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana = "=0.9.9"
hibana-wasip1-runtime = { git = "https://github.com/hibanaworks/hibana-wasip1-runtime", rev = "7905fa07bfd66db69ea7fb74883b7ca1e2b572bd" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
