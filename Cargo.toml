[package]
name = "choreofix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana = "=0.9.9"
hibana-wasip1-runtime = { git = "https://github.com/hibanaworks/hibana-wasip1-runtime", rev = "4ebdad1443cf49488eae924afe528f67f5a5953b" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# Keep the published 0.9.9 API while selecting its verified core repairs.
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "0a296df98be6664f07e426c086ffbb9486be7c71" }
