[package]
name = "choreofix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "3e2220a85368e03b8b0fa099c39c7ec13557a200", version = "=0.10.0" }
hibana-wasip1-runtime = { git = "https://github.com/hibanaworks/hibana-wasip1-runtime", rev = "4df26995ae1affef6fd2d559cfeeac2c05833b5f" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"
long_running_const_eval = "forbid"
