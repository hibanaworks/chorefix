[package]
name = "choreofix-experiments"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "9b8a3b34409c50c9658f87f8d7fb6208e93b5d43", version = "=0.10.0", default-features = false }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "b7fb27f5c7969e803c54a61d1da336dc53847ba7" }
choreofix-inputs = { path = "../inputs" }
pyo3 = { version = "=0.30.1", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
