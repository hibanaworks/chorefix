[package]
name = "choreofix-experiments"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "d892df33205fd8c04be205948e24dd9daa9f022c", version = "=0.10.0", default-features = false }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "67933c6f96959fb0a87b167d8bc014d4c17afe41" }
choreofix-inputs = { path = "../inputs" }
pyo3 = { version = "=0.30.1", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
