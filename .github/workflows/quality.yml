name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      PYTHONHASHSEED: '0'
      PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install Rust and the guest target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain stable wasm32-wasip1
      - name: Restore the recorded upstream sources
        run: cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- restore
      - name: Install the locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Check projected task implementations
        run: |
          cargo +stable fmt --check
          cargo +stable fmt --manifest-path tools/inputs/Cargo.toml --check
          cargo +stable test --locked --manifest-path tools/inputs/Cargo.toml
          cargo +stable clippy --locked --manifest-path tools/inputs/Cargo.toml --all-targets -- -D warnings
          cargo +stable fmt --manifest-path tools/runner/Cargo.toml --check
          cargo +stable test --locked --manifest-path tools/runner/Cargo.toml
          cargo +stable clippy --locked --manifest-path tools/runner/Cargo.toml --all-targets -- -D warnings
          cargo +stable fmt --manifest-path vendor/hibana-wash/Cargo.toml --check
          cargo +stable test --locked --manifest-path vendor/hibana-wash/Cargo.toml --lib
          cargo +stable test --locked
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable clippy --locked --manifest-path vendor/hibana-wash/Cargo.toml --target wasm32-wasip1 --release -- -D warnings
      - name: Check the actual WASI and task effect boundary
        run: |
          find src tests -type f -name '*.rs' -print0 | sort -z | xargs -0 sha256sum > cicd-source-before.sha256
          sha256sum Cargo.toml Cargo.lock >> cicd-source-before.sha256
          bash tools/build_shell.sh
          find src tests -type f -name '*.rs' -print0 | sort -z | xargs -0 sha256sum > cicd-source-after.sha256
          sha256sum Cargo.toml Cargo.lock >> cicd-source-after.sha256
          cmp cicd-source-before.sha256 cicd-source-after.sha256
          jq -n \
            --arg binary_sha256 "$(sha256sum target/debug/cicd-wasi | cut -d ' ' -f 1)" \
            --arg source_manifest_sha256 "$(sha256sum cicd-source-after.sha256 | cut -d ' ' -f 1)" \
            '{binary_sha256:$binary_sha256,source_manifest_sha256:$source_manifest_sha256,source_unchanged:true,scored_benchmark:false}' > cicd-build-receipt.json
          CHOREOFIX_CICD_WASI_BINARY="$PWD/target/debug/cicd-wasi" \
            CHOREOFIX_CICD_BUILD_RECEIPT="$PWD/cicd-build-receipt.json" \
            CHOREOFIX_EVIDENCE_ROOT="$PWD/output/cicd-boundary" \
            cargo +stable test --locked --manifest-path tools/runner/Cargo.toml cicd_boundary:: -- --ignored --test-threads=1 --nocapture
          for depth in 0 1 2; do
            cargo +stable run --locked --bin api-boundary -- "$depth" "api-boundary-depth$depth"
            cargo +stable run --locked --bin api-boundary -- --check-mutants "api-boundary-depth$depth/events.jsonl" "api-boundary-depth$depth-mutants"
          done
          cargo +stable run --locked --bin codebase-boundary -- 1E codebase-boundary-1E
          cargo +stable run --locked --bin codebase-boundary -- --check-mutants codebase-boundary-1E/events.jsonl codebase-boundary-1E-mutants
          cargo +stable run --locked --bin codebase-boundary -- 1M codebase-boundary-1M
          cargo +stable run --locked --bin codebase-boundary -- --check-mutants codebase-boundary-1M/events.jsonl codebase-boundary-1M-mutants
          cargo +stable run --locked --bin codebase-boundary -- 1E:terminal-test-failure codebase-boundary-terminal-test-failure
          cargo +stable run --locked --bin codebase-boundary -- 1M:terminal-test-failure codebase-boundary-terminal-test-failure-1M
          jq -n \
            --arg binary_sha256 "$(sha256sum target/debug/writing-wasi | cut -d ' ' -f 1)" \
            --arg source_manifest_sha256 "$(sha256sum cicd-source-after.sha256 | cut -d ' ' -f 1)" \
            '{binary_sha256:$binary_sha256,source_manifest_sha256:$source_manifest_sha256,source_unchanged:true,scored_benchmark:false}' > writing-build-receipt.json
          CHOREOFIX_WRITING_WASI_BINARY="$PWD/target/debug/writing-wasi" \
            CHOREOFIX_WRITING_BUILD_RECEIPT="$PWD/writing-build-receipt.json" \
            CHOREOFIX_EVIDENCE_ROOT="$PWD/output/writing-boundary" \
            cargo +stable test --locked --manifest-path tools/runner/Cargo.toml writing_boundary:: -- --ignored --test-threads=1 --nocapture
          cargo +stable run --locked --bin philosophers-boundary -- 9E philosophers-boundary-9E
          cargo +stable run --locked --bin philosophers-boundary -- --check-mutants philosophers-boundary-9E/events.jsonl philosophers-boundary-9E-mutants
          cargo +stable run --locked --bin philosophers-boundary -- 9M philosophers-boundary-9M
          cargo +stable run --locked --bin philosophers-boundary -- --check-mutants philosophers-boundary-9M/events.jsonl philosophers-boundary-9M-mutants
          cargo +stable run --locked --bin philosophers-boundary -- 9H philosophers-boundary-9H
          cargo +stable run --locked --bin philosophers-boundary -- --check-mutants philosophers-boundary-9H/events.jsonl philosophers-boundary-9H-mutants
          CHOREOFIX_WRITING_RUNTIME="$PWD/target/debug/writing-wasi" cargo +stable test --locked --manifest-path tools/runner/Cargo.toml original_simulator_overlaps -- --ignored --nocapture
          jq -n \
            --arg binary_sha256 "$(sha256sum target/debug/review-wasi | cut -d ' ' -f 1)" \
            --arg source_manifest_sha256 "$(sha256sum cicd-source-after.sha256 | cut -d ' ' -f 1)" \
            '{binary_sha256:$binary_sha256,source_manifest:"cicd-source-after.sha256",source_manifest_sha256:$source_manifest_sha256,source_unchanged:true,scored_benchmark:false}' > review-build-receipt.json
          CHOREOFIX_REVIEW_WASI_BINARY="$PWD/target/debug/review-wasi" \
            CHOREOFIX_REVIEW_BUILD_RECEIPT="$PWD/review-build-receipt.json" \
            CHOREOFIX_EVIDENCE_ROOT="$PWD/output/review-boundary" \
            cargo +stable test --locked --manifest-path tools/runner/Cargo.toml review_boundary:: -- --ignored --test-threads=1 --nocapture
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- verify
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- matrix --check
      - name: Inspect hibana-wash imports and memory
        run: |
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- wash vendor/hibana-wash/target/wasm32-wasip1/release/hibana-wash.wasm > wash-profile.json
      - name: Retain direct WASI boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-wasi-boundary
          path: |
            output/writing-boundary/
            writing-build-receipt.json
            codebase-boundary-*/
            philosophers-boundary-*/
            api-boundary-*/
            output/writing-rust-runner-probe*/
            output/cicd-boundary/
            cicd-source-*.sha256
            cicd-build-receipt.json
            output/review-boundary/
            review-build-receipt.json
          if-no-files-found: ignore
